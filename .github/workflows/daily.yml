name: Daily Gita verse

on:
  schedule:
    - cron: "30 0 * * *"    # 00:30 UTC = 6:00 AM India time. Change to suit your audience.
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-gita
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Write lessons, make the video, post it
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python run_daily.py daily

      - name: Save new lessons and progress
        if: always()
        run: |
          git config user.name "gita-bot"
          git config user.email "gita-bot@users.noreply.github.com"
          git add content data/state.json site/verses.js
          git diff --cached --quiet || git commit -m "Day $(date -u +%F): new verse"
          git push

      - name: Keep a copy of the video (30 days)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: out/*.mp4
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site

      - uses: actions/deploy-pages@v4
        if: always()
