<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<style>
@font-face{font-family:"Baloo 2";src:url("../assets/fonts/Baloo2.ttf");font-weight:400 800}
@font-face{font-family:"Tiro Skt";src:url("../assets/fonts/TiroDevanagariSanskrit-Regular.ttf")}
@font-face{font-family:"Tiro Skt";src:url("../assets/fonts/TiroDevanagariSanskrit-Italic.ttf");font-style:italic}
*{box-sizing:border-box}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{font-family:"Baloo 2",sans-serif;color:#211A55;background:#F2F6FF;
  background-image:radial-gradient(#DCE5FA 3px,transparent 3.2px);background-size:48px 48px;position:relative}
.top{position:absolute;left:0;right:0;top:0;height:330px;background:linear-gradient(150deg,var(--c1),var(--c2));border-radius:0 0 80px 80px;box-shadow:0 14px 0 var(--c3)}
.brand{position:absolute;top:120px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-size:46px}
.brand .pill{background:#fff;color:var(--c3);border-radius:999px;padding:4px 30px;font-size:40px}
.stage{position:absolute;left:70px;right:70px;top:420px;bottom:300px;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
.foot{position:absolute;left:0;right:0;bottom:150px;text-align:center;font-weight:700;font-size:36px;color:#5A5788}
.tag{display:inline-block;align-self:flex-start;background:var(--c1);color:#fff;font-weight:800;font-size:40px;border-radius:24px;padding:6px 30px;margin-bottom:40px}
.big{font-size:92px;line-height:1.08;font-weight:800;margin:0}
.mid{font-size:62px;line-height:1.3;font-weight:600;margin:0}
.icon{font-size:220px;line-height:1;text-align:center;margin-bottom:50px}
.card{background:#fff;border:6px solid var(--c1);border-radius:56px;box-shadow:14px 14px 0 var(--c1);padding:60px 56px}
.leaf{color:#3B2306;border-radius:110px/50%;padding:90px 80px;text-align:center;position:relative;
  background:repeating-linear-gradient(180deg,rgba(110,70,15,.10) 0 2px,transparent 2px 16px),linear-gradient(175deg,#F1DDA8,#DFBC74);
  box-shadow:inset 0 0 0 4px #B98C3E,0 14px 0 rgba(120,80,20,.35)}
.leaf::before,.leaf::after{content:"";position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:radial-gradient(circle,#5a3a10 0 6px,#8a5f22 6px 10px,transparent 11px)}
.leaf::before{left:34px}.leaf::after{right:34px}
.speaker{font-family:"Tiro Skt";font-size:44px;opacity:.75;margin-bottom:10px}
.skt{font-family:"Tiro Skt";font-size:54px;line-height:1.65;margin:0}
.tl{font-family:"Tiro Skt";font-style:italic;font-size:36px;line-height:1.5;margin:36px 0 0;opacity:.85}
.opts{display:grid;gap:26px;margin-top:46px}
.opt{display:flex;gap:26px;align-items:center;color:#fff;font-weight:700;font-size:50px;line-height:1.2;border-radius:36px;padding:26px 30px}
.opt b{width:78px;height:78px;border-radius:24px;background:rgba(255,255,255,.28);display:grid;place-items:center;flex:none}
.opt:nth-child(1){background:#E8457E}.opt:nth-child(2){background:#2F6FE4}.opt:nth-child(3){background:#E8930C}.opt:nth-child(4){background:#2E9E55}
.opt.dim{opacity:.25}.opt.win{outline:12px solid #1E8A42;outline-offset:8px}
.center{text-align:center}
.url{display:inline-block;background:#FFBE0B;color:#2A1E00;font-weight:800;border-radius:30px;padding:12px 40px;font-size:46px;margin-top:40px}
</style></head>
<body><div class="top"></div><div class="brand"><span id="brand"></span><span class="pill" id="pill"></span></div>
<div class="stage" id="stage"></div><div class="foot" id="foot"></div>
<script>
function esc(s){return String(s).replace(/<(?!\/?(b|i)>)/g,"&lt;")}
function render(d){
  const r=document.documentElement.style;
  r.setProperty("--c1",d.c1);r.setProperty("--c2",d.c2);r.setProperty("--c3",d.c3);
  document.getElementById("brand").textContent=d.brand;
  document.getElementById("pill").textContent=`Day ${d.day}`;
  document.getElementById("foot").textContent=`Bhagavad Gita ${d.ch}.${d.v} · ${d.chName}`;
  const s=document.getElementById("stage"); const k=d.kind;
  if(k==="hook") s.innerHTML=`<div class="icon">${d.icon}</div><p class="big center">${esc(d.text)}</p>`;
  if(k==="shloka") s.innerHTML=`<div class="leaf">${d.speaker?`<div class="speaker">${d.speaker}</div>`:""}<p class="skt">${d.sanskrit.join("<br>")}</p><p class="tl">${d.translit.join("<br>")}</p></div>`;
  if(k==="meaning") s.innerHTML=`<span class="tag">What it means</span><div class="card"><p class="mid">${esc(d.text)}</p></div>`;
  if(k==="example") s.innerHTML=`<span class="tag">In your life</span><div class="card"><div style="font-size:120px;line-height:1">${d.emoji}</div><p class="big" style="font-size:70px;margin:20px 0">${esc(d.title)}</p><p class="mid" style="font-size:54px">${esc(d.text)}</p></div>`;
  if(k==="lesson") s.innerHTML=`<div class="icon">💡</div><p class="big center">${esc(d.text)}</p>`;
  if(k==="quiz"||k==="answer") s.innerHTML=`<span class="tag">${k==="quiz"?"Quick quiz! Comment your answer":"Answer"}</span><p class="mid" style="font-weight:800">${esc(d.q)}</p><div class="opts">${d.o.map((o,i)=>`<div class="opt ${k==="answer"?(i===d.a?"win":"dim"):""}"><b>${"ABCD"[i]}</b><span>${esc(o)}</span></div>`).join("")}</div>`;
  if(k==="outro") s.innerHTML=`<div class="icon">🪷</div><p class="big center">Come back tomorrow for verse ${d.next}!</p><p class="mid center" style="margin-top:30px">Full lesson, story &amp; quiz:</p><div class="center"><span class="url">${esc(d.url)}</span></div>`;
  return document.fonts.ready;
}
</script></body></html>
